<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Jewel Bill</title>
<style>
:root{--g:#7a4b00;--g2:#b8860b;--bg:#faf6ee;--card:#fff;--ln:#e6dcc8;--tx:#2a2112;--mu:#7d725e;--red:#b3261e;--grn:#1b7a3a}
*{box-sizing:border-box}
body{margin:0;font:15px/1.35 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
header{position:sticky;top:0;background:var(--g);color:#fff;padding:12px 16px;font-size:18px;font-weight:600;z-index:5;display:flex;align-items:center}
.hb{background:none;border:0;color:#fff;font-size:24px;margin-right:8px;padding:0 6px}
#main{padding:12px;max-width:640px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0;font-size:12px;color:var(--mu)}
nav button.on{color:var(--g);font-weight:700}
nav button span{display:block;font-size:18px}
#fab{position:fixed;right:16px;bottom:78px;width:54px;height:54px;border-radius:50%;background:var(--g2);color:#fff;border:0;font-size:28px;z-index:6;box-shadow:0 3px 10px #0004;display:flex;align-items:center;justify-content:center}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;font-size:15px;background:#fff;margin:3px 0 8px;color:var(--tx)}
input:disabled{background:#f1ece0;color:var(--mu)}
label{display:block;font-size:12px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.card.tap{cursor:pointer}
details.card summary{cursor:pointer}
.row{background:#fffaf0;border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:10px}
.row.fx{background:#f1f7ff}.row.mt{background:#f4fbf1}
.rh{display:flex;justify-content:space-between;align-items:center}
.btn{padding:11px 14px;border-radius:10px;border:1px solid var(--g);background:#fff;color:var(--g);font-size:15px;font-weight:600}
.btn.pri{background:var(--g);color:#fff}.btn.danger{color:var(--red);border-color:var(--red)}.btn.ghost{width:100%;margin-bottom:10px;border-style:dashed}.btn.sm{padding:7px 10px;font-size:13px}
.x{border:0;background:none;color:var(--red);font-size:13px}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:9px;border:1px solid var(--ln);background:#fff;border-radius:8px;color:var(--tx)}
.seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
.top{display:flex;justify-content:space-between;gap:8px}.mu{color:var(--mu);font-size:13px}
.b{display:inline-block;font-size:11px;padding:2px 7px;border-radius:9px;color:#fff;margin-left:4px}.b.sale{background:var(--grn)}.b.purchase{background:#a05a00}.b.gold{background:#b8860b}.b.silver{background:#6b7280}.b.dealer{background:#3949ab}
.pos{color:var(--grn)}.neg{color:var(--red)}
.sum{background:#fff3d6;border:1px solid var(--g2);border-radius:10px;padding:10px}
.sum div{display:flex;justify-content:space-between;padding:2px 0;gap:8px}.sum .big{font-size:18px;font-weight:700}.sum hr{border:0;border-top:1px dashed var(--g2);margin:6px 0}.sum .hd{font-size:11px;letter-spacing:.06em;color:var(--mu);font-weight:700}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
#sheet.open{display:flex}
.sh-h{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--g);color:#fff}.sh-h .x{color:#fff;font-size:20px}
.sh-b{flex:1;overflow:auto;padding:12px;max-width:640px;width:100%;margin:auto}
.sh-f{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ln);background:#fff}.sh-f .btn{flex:1}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px;color:var(--tx)}.chk input{width:20px;height:20px;margin:0}
h4{margin:14px 0 6px}
.pv{background:#fff;border:1px solid var(--ln);padding:10px;overflow:auto}
.tw{overflow:auto;background:#fff;border:1px solid var(--ln);border-radius:10px;margin:8px 0}
table.rep{width:100%;border-collapse:collapse;font-size:13px}
table.rep th,table.rep td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
table.rep th:first-child,table.rep td:first-child{text-align:left}
table.rep th{background:#fff3d6;position:sticky;top:0}
table.rep tr.tot td{font-weight:700;background:#faf6ee}
#printArea{display:none}
.pb{font:13px/1.4 Arial,sans-serif;color:#000}.pb h2{margin:0;text-align:center}.pb .c{text-align:center}
.pb table{width:100%;border-collapse:collapse;margin:8px 0}.pb th,.pb td{border:1px solid #000;padding:4px;text-align:right}.pb th:first-child,.pb td:first-child{text-align:left}
.pb .meta{display:flex;justify-content:space-between;margin:6px 0}.pb .t{display:flex;justify-content:space-between;padding:2px 0}.pb .gt{font-weight:700;font-size:15px;border-top:2px solid #000;margin-top:4px;padding-top:4px}.pb .sm{font-size:12px}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}body{background:#fff;padding:0}@page{margin:8mm}}
</style></head><body>
<header id="title"></header>
<div id="main"></div>
<button id="fab" data-a="fab">+</button>
<nav>
<button data-t="bills"><span>🧾</span>Bills</button>
<button data-t="cust"><span>👥</span>Parties</button>
<button data-t="stock"><span>📦</span>Stock</button>
<button data-t="reports"><span>📊</span>Reports</button>
<button data-t="more"><span>☰</span>More</button>
</nav>
<div id="sheet"></div>
<div id="printArea"></div>
<datalist id="prods"></datalist>
<datalist id="catlist"></datalist>
<datalist id="cats"><option>Rent</option><option>Salary</option><option>Electricity</option><option>Tea / Food</option><option>Transport</option><option>Repairs</option><option>Hallmarking</option><option>Packaging</option><option>Other</option></datalist>
<input type="file" id="imp" accept=".json" style="display:none">
<input type="file" id="impcsv" accept=".csv,.txt,text/csv,text/plain" style="display:none">
<script>
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>parseFloat(String(v??'').replace(/,/g,''))||0;
const r2=x=>Math.round((x+Number.EPSILON)*100)/100, r3=x=>Math.round((x+Number.EPSILON)*1000)/1000;
const f2=v=>n(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const f3=v=>n(v).toLocaleString('en-IN',{minimumFractionDigits:3,maximumFractionDigits:3});
const f0=v=>Math.round(n(v)).toLocaleString('en-IN');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nz=v=>v===0||v==='0'||v===''||v==null?'':v;
const KEY='jewelbill.v1';
const UNC='Uncategorised';
const PD={shop:1,cust:1,phone:1,addr:0,date:1,no:1,code:0,cat:0,name:1,qty:0,weight:1,stoneWt:0,tunch:1,tunchBhav:0,wastage:1,fine:1,bhav:1,total:1,extras:1,totalFine:1,settle:1,paid:1,note:0,sign:1};
const PL={shop:'Shop header',cust:'Party name',phone:'Party contact',addr:'Party address',date:'Date',no:'Bill number',code:'Item code',cat:'Category',name:'Product',qty:'Pieces',weight:'Weight',stoneWt:'Stone weight',tunch:'Tunch %',tunchBhav:'Tunch bhav (bhav × tunch)',wastage:'Wastage %',fine:'Fine weight',bhav:'Bhav',total:'Item amount',extras:'Extra charges (hallmark, packing, stone)',totalFine:'Total fine weight',settle:'Fine settlement (metal / rate cut / net fine)',paid:'Cash received / balance',note:'Note',sign:'Signature line'};
function fresh(){return{customers:[],bills:[],expenses:[],products:[],fixings:[],categories:['Earrings','Rings','Chains','Necklace','Bangles','Bracelet','Pendant','Mangalsutra','Anklet','Coin / Bar','Other'],seq:{sale:0,purchase:0,prod:0},settings:{shop:{name:'My Jewellers',addr:'',phone:'',gstin:''},wastageMode:'add',silverUnit:'kg',curBhav:{gold:'',silver:''},lastT:{gold:'',silver:''},lastW:{gold:'',silver:''},print:{...PD}}}}
function norm(d){
 const f=fresh(),s=d.settings||{},o={...f,...d};
 o.settings={...f.settings,...s,shop:{...f.settings.shop,...(s.shop||{})},print:{...PD,...(s.print||{})}};
 const mm=v=>(v&&typeof v==='object')?{gold:v.gold||'',silver:v.silver||''}:{gold:v||'',silver:''};
 o.settings.curBhav=mm(s.curBhav);o.settings.lastT=mm(s.lastT!==undefined?s.lastT:s.lastTunch);o.settings.lastW=mm(s.lastW!==undefined?s.lastW:s.lastWastage);
 ['customers','bills','expenses','products','fixings'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
 o.seq={sale:0,purchase:0,prod:0,...(d.seq||{})};
 o.categories=Array.isArray(d.categories)&&d.categories.length?d.categories:f.categories;
 o.customers.forEach(c=>{c.type=c.type||'customer'});
 o.products.forEach(p=>{p.category=p.category||UNC;p.dealerId=p.dealerId||'';if(!p.code){o.seq.prod++;p.code=(p.metal==='silver'?'S-':'G-')+String(o.seq.prod).padStart(4,'0')}});
 o.fixings.forEach(x=>{x.div=x.div||1;x.paid=n(x.paid);x.partyId=x.partyId||''});
 o.bills.forEach(b=>{b.metal=b.metal||'gold';b.div=b.div||1;b.metalIn=b.metalIn||[];b.fixes=b.fixes||[];b.items=b.items||[];b.extras=b.extras||{};
  if(!b.v){b.fixes.forEach(x=>{if(!x.fid&&n(x.fine)>0){const fx={id:uid(),date:b.date,type:b.type,metal:b.metal,partyId:b.customerId||'',fine:n(x.fine),rate:n(x.rate),div:b.div,paid:0,note:'Migrated from '+b.no};o.fixings.push(fx);x.fid=fx.id}});b.v=4}});
 return o}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return norm(d)}catch(e){}return fresh()}
let db=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save: storage full or blocked')}}
const DIV=m=>m==='silver'&&db.settings.silverUnit!=='g'?1000:1;
const UNIT=div=>div===1000?'kg':'g';
const amt=(fine,bhav,div)=>n(fine)*n(bhav)/(div||1);
function calcFine(w,t,wa){w=n(w);t=n(t);wa=n(wa);return db.settings.wastageMode==='mult'?w*t/100*(1+wa/100):w*(t+wa)/100}
const tbv=i=>n(i.bhav)*n(i.tunch)/100;
/* Fine-weight settlement: net fine = bill fine - rate-cut fine - metal fine. Net fine is settled in cash at bill bhav (or carried as fine balance). */
function totals(b){
 const div=b.div||1;let fine=0,items=0,wt=0;
 (b.items||[]).forEach(i=>{fine+=n(i.fine);items+=n(i.total);wt+=n(i.weight)});
 const e=b.extras||{},ex=n(e.hallmark)+n(e.packaging)+n(e.stone)+n(e.other),grand=items+ex;
 let fixFine=0;(b.fixes||[]).forEach(x=>{fixFine+=n(x.fine)});
 let mFine=0;(b.metalIn||[]).forEach(m=>{mFine+=n(m.fine)});
 const nf=fine-fixFine-mFine,carry=!!b.carry;
 const cashFine=carry?0:items-(fixFine+mFine)*n(b.bhav)/div;
 const net=cashFine+ex;
 return{fine,items,ex,grand,wt,fixFine,mFine,nf,carry,cashFine,carryFine:carry?nf:0,net,bal:net-n(b.paid)}}
const sorted=()=>[...db.bills].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
const custName=id=>(db.customers.find(c=>c.id===id)||{}).name||'';
const fixVal=f=>n(f.fine)*n(f.rate)/(f.div||1);
function stockMap(excl){const m={};db.products.forEach(p=>m[p.id]={q:n(p.openQty),w:n(p.openWt)});db.bills.forEach(b=>{if(b.id===excl)return;const s=b.type==='purchase'?1:-1;(b.items||[]).forEach(i=>{const x=m[i.pid];if(x){x.q+=s*n(i.qty);x.w+=s*n(i.weight)}})});return m}
const fixUsed=(fid,excl)=>{let u=0;db.bills.forEach(b=>{if(b.id===excl)return;(b.fixes||[]).forEach(x=>{if(x.fid===fid)u+=n(x.fine)})});return u};
const findProd=(s,metal,cat)=>{s=String(s||'').trim().toLowerCase();if(!s)return null;const L=db.products.filter(p=>p.metal===metal);return L.find(p=>p.code.toLowerCase()===s)||L.find(p=>p.name.toLowerCase()===s&&(!cat||p.category===cat))||L.find(p=>p.name.toLowerCase()===s)||null};
function genCode(metal){let c;do{db.seq.prod++;c=(metal==='silver'?'S-':'G-')+String(db.seq.prod).padStart(4,'0')}while(db.products.some(p=>p.code.toLowerCase()===c.toLowerCase()));return c}
function addCat(c){c=(c||'').trim();if(c&&c!==UNC&&!db.categories.some(x=>x.toLowerCase()===c.toLowerCase()))db.categories.push(c)}
const allCats=()=>[...new Set([...db.categories,...db.products.map(p=>p.category)])].filter(Boolean).sort((a,b)=>a.localeCompare(b));
/* party ledger: + = party owes us, - = we owe party */
function ledger(id,upTo){
 const rows=[];
 db.bills.filter(b=>b.customerId===id&&(!upTo||b.date<=upTo)).forEach(b=>{const t=totals(b),s=b.type==='sale'?1:-1;
  rows.push({date:b.date,ref:b.no,desc:(s>0?'Sale ':'Purchase ')+b.metal+(t.carry?' (fine carried '+f3(t.nf)+' g)':''),amt:s*t.net,fine:s*t.carryFine,metal:b.metal});
  if(n(b.paid))rows.push({date:b.date,ref:b.no,desc:s>0?'Cash received':'Cash paid',amt:-s*n(b.paid),fine:0,metal:b.metal})});
 db.fixings.filter(f=>f.partyId===id&&(!upTo||f.date<=upTo)).forEach(f=>{const s=f.type==='sale'?1:-1;
  rows.push({date:f.date,ref:'Rate cut',desc:f3(f.fine)+' g '+f.metal+' @ '+f2(f.rate),amt:s*fixVal(f),fine:0,metal:f.metal});
  if(n(f.paid))rows.push({date:f.date,ref:'Rate cut',desc:s>0?'Cash received':'Cash paid',amt:-s*n(f.paid),fine:0,metal:f.metal})});
 rows.sort((a,b)=>a.date.localeCompare(b.date));
 const fine={gold:0,silver:0};let bal=0;rows.forEach(r=>{bal+=r.amt;fine[r.metal]+=r.fine});
 return{rows,bal,fine}}
const custBal=id=>ledger(id).bal;
function dl(name,text,mime){const bl=new Blob([text],{type:mime||'text/csv'});const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const csvCell=v=>{v=String(v??'');return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','||ch==='\t'||ch===';'){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()!==''))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x.trim()!==''))rows.push(r);return rows}

/* ---------- navigation ---------- */
const TITLES={bills:'Bills',cust:'Parties',stock:'Inventory',reports:'Reports',more:'More',fix:'Rate cuts',bhav:'Bhav & Profit',exp:'Expenses',set:'Settings'};
const NAVOF=t=>['bills','cust','stock','reports'].includes(t)?t:'more';
let tab='bills',bf='all',q='',pf='all',sq='',sf='all',sc='all',ff='open',bm='gold',expMonth=today().slice(0,7),bFrom='',bTo='';
const main=$('#main'),sheet=$('#sheet');
function render(){
 $('#title').innerHTML=(NAVOF(tab)==='more'&&tab!=='more'?'<button class="hb" data-a="back">‹</button>':'')+TITLES[tab];
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===NAVOF(tab)));
 $('#fab').style.display=['bills','cust','stock','fix'].includes(tab)?'flex':'none';
 ({bills:vBills,cust:vCust,stock:vStock,reports:vReports,more:vMore,fix:vFix,bhav:vBhav,exp:vExp,set:vSet})[tab]();
 $('#prods').innerHTML=[...new Set(db.products.flatMap(p=>[p.name,p.code]))].map(x=>`<option value="${esc(x)}">`).join('');
 $('#catlist').innerHTML=allCats().map(x=>`<option value="${esc(x)}">`).join('');
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
function openSheet(h){sheet.innerHTML=h;sheet.classList.add('open')}
function closeSheet(){sheet.classList.remove('open');sheet.innerHTML=''}
const chips=(arr,cur,attr)=>`<div class="seg">${arr.map(x=>`<button data-${attr}="${x[0]}" class="${cur===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>`;

/* ---------- bills list ---------- */
function vBills(){
 main.innerHTML=chips([['all','All'],['sale','Sales'],['purchase','Purchases']],bf,'f')+`<input id="q" placeholder="Search party / product / code / bill no" value="${esc(q)}"><div id="list"></div>`;
 main.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{bf=b.dataset.f;vBills()});
 $('#q').oninput=e=>{q=e.target.value;fillBills()};fillBills();
}
function fillBills(){
 const s=q.toLowerCase();
 const l=sorted().filter(b=>(bf==='all'||b.type===bf)&&(!s||(b.customerName+' '+b.no+' '+b.items.map(i=>i.name+' '+(i.code||'')).join(' ')).toLowerCase().includes(s)));
 $('#list').innerHTML=l.length?l.map(b=>{const t=totals(b);return`<div class="card tap" data-a="detail" data-id="${b.id}"><div class="top"><b>${esc(b.customerName)}</b><span><span class="b ${b.metal}">${b.metal.toUpperCase()}</span><span class="b ${b.type}">${b.type==='sale'?'SALE':'PURCHASE'}</span></span></div><div class="mu">${esc(b.no)} · ${b.date} · Fine ${f3(t.fine)} g${t.fixFine||t.mFine?' · Net fine '+f3(t.nf)+' g':''}</div><div class="top"><span>₹ ${f2(t.net)}${t.carry?' <span class="mu">(fine carried)</span>':''}</span>${t.bal>0.5?`<span class="neg">Due ₹ ${f2(t.bal)}</span>`:t.bal<-0.5?`<span class="pos">Credit ₹ ${f2(-t.bal)}</span>`:'<span class="pos">Settled</span>'}</div></div>`}).join(''):'<p class="mu">No bills yet. Tap + to create one.</p>';
}

/* ---------- bill form ---------- */
let draft=null;
const newItem=()=>({pid:'',code:'',cat:'',name:'',qty:'',weight:'',tunch:db.settings.lastT[draft.metal]||'',wastage:db.settings.lastW[draft.metal]||'',fine:'',bhav:draft.bhav,total:'',stoneWt:''});
function openBill(id,type,cust){
 const ex=id&&db.bills.find(b=>b.id===id);
 if(ex){draft=JSON.parse(JSON.stringify(ex));draft.isNew=false;draft.fixes=draft.fixes||[];draft.metalIn=draft.metalIn||[];
  draft.pn={name:ex.customerId?'':(ex.customerName&&ex.customerName!=='Walk-in'?ex.customerName:''),phone:ex.walkPhone||'',addr:ex.walkAddr||'',type:ex.type==='purchase'?'dealer':'customer',save:false}}
 else draft={id:uid(),type:type||'sale',metal:'gold',div:DIV('gold'),date:today(),customerId:cust||'',bhav:db.settings.curBhav.gold||'',items:[],extras:{hallmark:'',packaging:'',stone:'',other:''},paid:'',note:'',fixes:[],metalIn:[],carry:false,pn:{name:'',phone:'',addr:'',type:type==='purchase'?'dealer':'customer',save:true},isNew:true};
 if(!draft.items.length)draft.items.push(newItem());
 openSheet(formHTML());summary();
}
function rerender(){const sb=sheet.querySelector('.sh-b'),st=sb?sb.scrollTop:0;sheet.innerHTML=formHTML();summary();const nb=sheet.querySelector('.sh-b');if(nb)nb.scrollTop=st}
function rowHTML(it,i,sm){
 const d=draft,u=UNIT(d.div);
 const pm=db.products.filter(p=>p.metal===d.metal);
 const cats=[...new Set([...allCats().filter(c=>pm.some(p=>p.category===c)),...(it.cat?[it.cat]:[])])];
 const prods=pm.filter(p=>!it.cat||p.category===it.cat).sort((a,b)=>a.name.localeCompare(b.name));
 const st=it.pid&&sm[it.pid];
 const hint=st?`<div class="mu ${st.q<=0&&st.w<=0?'neg':''}" style="margin:-4px 0 6px">Code ${esc(it.code)} · In stock: ${f0(st.q)} pcs · ${f3(st.w)} g</div>`:'';
 return`<div class="row" data-i="${i}"><div class="rh"><b>Item ${i+1}</b>${d.items.length>1?`<button class="x" data-a="del" data-i="${i}">remove</button>`:''}</div>
<div class="g2"><select data-k="cat"><option value="">All categories</option>${cats.map(c=>`<option ${c===it.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><select data-k="pid"><option value="">Pick product…</option>${prods.map(p=>`<option value="${p.id}" ${p.id===it.pid?'selected':''}>${esc(p.name)} · ${esc(p.code)}</option>`).join('')}</select></div>

function summary(){

 const g=$('#f-grand');if(g&&document.activeElement!==g)g.value=t.grand?r2(t.grand):'';
 const sale=draft.type==='sale',R=r3(t.nf);
 el.innerHTML=`<div class="hd">FINE WEIGHT</div>

${t.carry?`<div><span>Net fine carried as fine balance</span><span>${f3(R)} g</span></div>`:`<div><span>Net fine × bhav ${R<0?'(refund)':''}</span><span>₹ ${f2(t.cashFine)}</span></div>`}<hr>
${t.ex?`<div><span>Extra charges</span><span>₹ ${f2(t.ex)}</span></div>`:''}

const setv=(row,k,v)=>{const el=row.querySelector(`[data-k="${k}"]`);if(el)el.value=v?v:''};
function refreshRows(skip){draft.items.forEach((it,i)=>{const row=$(`.row[data-i="${i}"]`);if(!row)return;['wastage','fine','bhav','total'].forEach(k=>{const el=row.querySelector(`[data-k="${k}"]`);if(el&&el!==skip)setv(row,k,it[k])});const tb=row.querySelector('[data-tb]');if(tb)tb.textContent=f2(tbv(it))})}
const exSum=()=>{const e=draft.extras;return n(e.hallmark)+n(e.packaging)+n(e.stone)+n(e.other)};
function backW(it){const w=n(it.weight),t=n(it.tunch);if(!w)return;if(db.settings.wastageMode==='mult'){if(t)it.wastage=r3((n(it.fine)*100/(w*t)-1)*100)}else it.wastage=r3(n(it.fine)/w*100-t)}
function calcItem(it){it.fine=r3(calcFine(it.weight,it.tunch,it.wastage));it.total=r2(amt(it.fine,it.bhav,draft.div))}
function applyGrand(skip){
 if(draft.grandFixed==null)return;
 const act=draft.items.filter(it=>n(it.weight)>0);if(!act.length)return;
 const T=draft.grandFixed-exSum(),D=draft.div;let base=0,wb=0;
 act.forEach(it=>{base+=n(it.bhav)*n(it.weight)*n(it.tunch)/100/D;wb+=n(it.bhav)*n(it.weight)/D});
 if(!wb)return;let d;
 if(db.settings.wastageMode==='mult'){if(!base)return;d=(T/base-1)*100}else d=(T-base)*100/wb;
 let sum=0;
 act.forEach(it=>{it.wastage=r3(d);it.fine=r3(calcFine(it.weight,it.tunch,it.wastage));it.total=r2(amt(it.fine,it.bhav,D));sum+=it.total});
 const last=act[act.length-1];last.total=r2(last.total+(T-sum));
 refreshRows(skip);
}
function applyProd(it,p){it.pid=p.id;it.name=p.name;it.code=p.code;it.cat=p.category;if(p.tunch!==''&&p.tunch!=null)it.tunch=p.tunch;if(p.wastage!==''&&p.wastage!=null)it.wastage=p.wastage;if(n(it.weight)>0){if(draft.grandFixed!=null)applyGrand();else calcItem(it)}}
function pnSet(el){draft.pn[el.dataset.pn]=el.type==='checkbox'?el.checked:el.value}
sheet.addEventListener('input',e=>{
 const el=e.target;if(!draft||!sheet.contains(el))return;
 if(el.dataset.p)return;
 if(el.dataset.pn){pnSet(el);return}
 if(el.dataset.fk){if(el.dataset.fk==='fid')return;const x=draft.fixes[+el.closest('.fx').dataset.fi];x[el.dataset.fk]=el.value;summary();return}
 if(el.dataset.mk){const row=el.closest('.mt'),m=draft.metalIn[+row.dataset.mi],k=el.dataset.mk;m[k]=el.value;
  if(k==='wt'||k==='purity'){m.fine=r3(n(m.wt)*n(m.purity)/100);row.querySelector('[data-mk="fine"]').value=m.fine||''}
  else if(k==='fine'&&n(m.wt)>0){m.purity=r3(n(m.fine)/n(m.wt)*100);row.querySelector('[data-mk="purity"]').value=m.purity||''}
  summary();return}
 if(el.id==='f-bhav'){draft.bhav=el.value;draft.items.forEach(it=>{it.bhav=el.value;it.total=r2(amt(it.fine,it.bhav,draft.div))});if(draft.grandFixed!=null)applyGrand();refreshRows();summary();return}
 if(el.id==='f-paid'){draft.paid=el.value;summary();return}
 if(el.id==='f-note'){draft.note=el.value;return}
 if(el.id==='f-grand'){draft.grandFixed=el.value.trim()===''?null:n(el.value);applyGrand();summary();return}
 if(el.dataset.x){draft.extras[el.dataset.x]=el.value;applyGrand();summary();return}
 const row=el.closest('.row[data-i]');if(!row)return;
 const it=draft.items[+row.dataset.i],k=el.dataset.k;
 if(k==='pid'||k==='cat')return;
 it[k]=el.value;
 if(k==='name'){const p=findProd(it.name,draft.metal,it.cat);it.pid=p?p.id:'';it.code=p?p.code:'';return}
 if(k==='qty'||k==='stoneWt'){summary();return}
 if(['weight','tunch','bhav'].includes(k)){if(draft.grandFixed!=null)applyGrand(el);else calcItem(it)}
 else{
  draft.grandFixed=null;
  if(k==='wastage')calcItem(it);
  else if(k==='fine'){backW(it);it.total=r2(amt(it.fine,it.bhav,draft.div))}
  else if(k==='total'){if(n(it.bhav)>0&&n(it.weight)>0){it.fine=r3(n(it.total)*draft.div/n(it.bhav));backW(it)}}
 }
 refreshRows(el);summary();
});

function resolveParty(d){
 const id=d.customerId,pn=d.pn,name=(pn.name||'').trim(),phone=(pn.phone||'').trim(),addr=(pn.addr||'').trim();
 if(id&&id!=='__new')return{id,name:custName(id)};
 if(id==='__new'&&!name){alert('Enter the new party\'s name');return null}
 if(name&&(id==='__new'||pn.save)){
  const type=id==='__new'?pn.type:(d.type==='purchase'?'dealer':'customer');
  const ex=db.customers.find(c=>(phone&&c.phone&&c.phone===phone)||(c.name.toLowerCase()===name.toLowerCase()&&c.type===type));
  if(ex){if(!ex.phone&&phone)ex.phone=phone;if(!ex.addr&&addr)ex.addr=addr;return{id:ex.id,name:ex.name}}
  const c={id:uid(),name,phone,addr,notes:'',type};db.customers.push(c);return{id:c.id,name}
 }
 return{id:'',name:name||'Walk-in',phone,addr}
}
function saveBill(print){
 const d=draft;
 if(!d.date){alert('Select the bill date');return}
 if(n(d.bhav)<=0){alert('Enter the bhav');return}
 const items=[];
 for(let k=0;k<d.items.length;k++){const i=d.items[k],lbl='Item '+(k+1)+': ';
  if(!n(i.weight)&&!n(i.fine)&&!n(i.total)&&!String(i.name||'').trim())continue;
  if(n(i.weight)<=0){alert(lbl+'enter the weight');return}
  if(n(i.tunch)<=0||n(i.tunch)>100){alert(lbl+'tunch must be between 0 and 100');return}
  if(n(i.wastage)<0||n(i.qty)<0||n(i.stoneWt)<0){alert(lbl+'values cannot be negative');return}
  if(n(i.fine)<=0){alert(lbl+'fine weight is zero, check weight, tunch and wastage');return}
  if(n(i.bhav)<=0){alert(lbl+'enter the bhav');return}
  items.push({pid:i.pid||'',code:i.code||'',cat:i.cat||'',name:(i.name||'').trim()||'Item',qty:n(i.qty),weight:n(i.weight),tunch:n(i.tunch),wastage:n(i.wastage),fine:n(i.fine),bhav:n(i.bhav),total:n(i.total),stoneWt:n(i.stoneWt)})}
 if(!items.length){alert('Add at least one item with weight');return}
 for(const k of['hallmark','packaging','stone','other'])if(n(d.extras[k])<0){alert('Extra charges cannot be negative');return}
 const fixes=[];
 for(let k=0;k<d.fixes.length;k++){const x=d.fixes[k];if(!n(x.fine)&&!x.fid&&!n(x.rate))continue;
  if(n(x.fine)<=0){alert('Rate cut '+(k+1)+': enter the fine weight');return}
  if(!x.fid&&n(x.rate)<=0){alert('Rate cut '+(k+1)+': enter the rate');return}
  if(n(x.paid)<0){alert('Rate cut '+(k+1)+': paid amount cannot be negative');return}
  fixes.push({fid:x.fid||'',fine:n(x.fine),rate:n(x.rate),paid:x.fid?0:n(x.paid)})}
 for(const x of fixes)if(x.fid){const f=db.fixings.find(z=>z.id===x.fid);if(f){const tot=fixes.reduce((s,y)=>s+(y.fid===x.fid?y.fine:0),0);if(tot>n(f.fine)-fixUsed(f.id,d.id)+0.0005){alert('Rate cut draws '+f3(tot)+' g but only '+f3(n(f.fine)-fixUsed(f.id,d.id))+' g is open');return}}}
 const metalIn=[];
 for(let k=0;k<d.metalIn.length;k++){const m=d.metalIn[k];if(!n(m.wt)&&!n(m.fine))continue;
  const fine=n(m.fine)||r3(n(m.wt)*n(m.purity)/100);
  if(fine<=0||n(m.purity)<=0||n(m.purity)>100){alert('Metal '+(k+1)+': enter weight and a purity between 0 and 100');return}
  metalIn.push({wt:n(m.wt),purity:n(m.purity),fine})}
 const tmp={items,extras:d.extras,fixes,metalIn,bhav:n(d.bhav),div:d.div,carry:d.carry,paid:d.paid},t=totals(tmp);
 if(d.carry&&d.customerId==='')if(!(d.pn.name||'').trim()||!d.pn.save){alert('To carry a fine balance, select a party or enter a name and save the walk-in as a party');return}
 if(d.type==='sale'){const sm=stockMap(d.id),need={};items.forEach(i=>{if(i.pid){const o=need[i.pid]=need[i.pid]||{q:0,w:0};o.q+=i.qty;o.w+=i.weight}});
  const bad=Object.keys(need).filter(pid=>sm[pid]&&(sm[pid].q-need[pid].q<-0.0005||sm[pid].w-need[pid].w<-0.0005)).map(pid=>db.products.find(p=>p.id===pid).name);
  if(bad.length&&!confirm('Stock will go negative for: '+bad.join(', ')+'. Save anyway?'))return}
 const pr=resolveParty(d);if(!pr)return;
 const b={id:d.id,v:4,type:d.type,metal:d.metal,div:d.div,date:d.date,customerId:pr.id,customerName:pr.name,bhav:n(d.bhav),items,extras:{hallmark:n(d.extras.hallmark),packaging:n(d.extras.packaging),stone:n(d.extras.stone),other:n(d.extras.other)},fixes,metalIn,carry:!!d.carry,paid:n(d.paid),note:d.note||'',no:d.no};
 if(!pr.id){b.walkPhone=pr.phone||'';b.walkAddr=pr.addr||''}
 if(d.isNew){db.seq[d.type]++;b.no=(d.type==='sale'?'S-':'P-')+String(db.seq[d.type]).padStart(4,'0')}

function saveProd(){

 if(n(tunch)<0||n(tunch)>100||n(wastage)<0){alert('Check tunch (0–100) and wastage');return}
 if(qv<0||wv<0){alert('Stock cannot be negative');return}
 let code=$('#p-code').value.trim();
 if(code&&db.products.some(x=>x.id!==pdraft.id&&x.code.toLowerCase()===code.toLowerCase())){alert('Code '+code+' is already used by another product');return}
 if(db.products.some(x=>x.id!==pdraft.id&&x.metal===metal&&x.category.toLowerCase()===cat.toLowerCase()&&x.name.toLowerCase()===name.toLowerCase()&&(x.dealerId||'')===dealerId)){alert('This product already exists in that category');return}
 if(!code)code=genCode(metal);addCat(cat);
 if(pdraft.isNew)db.products.push({id:pdraft.id,code,category:cat,name,dealerId,metal,tunch,wastage,openQty:qv,openWt:wv});
 else{const p=db.products.find(x=>x.id===pdraft.id),cur=stockMap()[p.id];Object.assign(p,{code,category:cat,name,dealerId,metal,tunch,wastage});p.openQty=n(p.openQty)+qv-cur.q;p.openWt=n(p.openWt)+wv-cur.w}

function importCSV(text){
 const rows=parseCSV(text);if(!rows.length){alert('The file is empty');return}
 const h=rows[0].map(x=>x.trim().toLowerCase()),ix=f=>h.findIndex(f);
 let ci={code:ix(x=>x.includes('code')||x==='sku'),cat:ix(x=>(x.includes('categ')&&!x.includes('sub'))||x.includes('master')),
  name:ix(x=>x.includes('sub')||(!x.includes('categ')&&!x.includes('code')&&!x.includes('dealer')&&!x.includes('supplier')&&(x.includes('name')||x.includes('product')||x.startsWith('item')))),
  dealer:ix(x=>x.includes('dealer')||x.includes('supplier')||x.includes('vendor')),metal:ix(x=>x.includes('metal')),tunch:ix(x=>x.includes('tunch')||x.includes('purity')),wastage:ix(x=>x.includes('wast')||x.includes('wst')),
  qty:ix(x=>x.includes('qty')||x.includes('pcs')||x.includes('piece')||x.includes('quant')),weight:ix(x=>x.includes('weight')||x==='wt'||x.includes('gross'))};
 let body=rows;if(ci.name>=0)body=rows.slice(1);else ci={code:0,cat:1,name:2,dealer:3,metal:4,tunch:5,wastage:6,qty:7,weight:8};
 const plan=[];
 body.forEach(r=>{const g=k=>ci[k]>=0?(r[ci[k]]||'').trim():'';const name=g('name');if(!name)return;
  const metal=/sil|^ag/i.test(g('metal'))?'silver':'gold',cat=g('cat')||UNC,code=g('code');
  const ex=(code&&db.products.find(p=>p.code.toLowerCase()===code.toLowerCase()))||db.products.find(p=>p.metal===metal&&p.name.toLowerCase()===name.toLowerCase()&&p.category.toLowerCase()===cat.toLowerCase());
  plan.push({code,cat,name,dealer:g('dealer'),metal,tunch:g('tunch'),wastage:g('wastage'),qty:g('qty'),weight:g('weight'),ex})});
 if(!plan.length){alert('No product rows found');return}
 const nn=plan.filter(x=>!x.ex).length;
 if(!confirm(`Import ${plan.length} products: ${nn} new, ${plan.length-nn} existing will be updated. Stock in the file replaces current stock. Continue?`))return;
 const sm=stockMap(),dealerOf=name=>{if(!name)return'';let c=db.customers.find(x=>x.type==='dealer'&&x.name.toLowerCase()===name.toLowerCase());if(!c){c={id:uid(),name,phone:'',addr:'',notes:'',type:'dealer'};db.customers.push(c)}return c.id};
 plan.forEach(x=>{
  const dealerId=dealerOf(x.dealer);addCat(x.cat);
  if(x.ex){const p=x.ex,cur=sm[p.id];p.category=x.cat;if(dealerId)p.dealerId=dealerId;if(x.tunch!=='')p.tunch=x.tunch;if(x.wastage!=='')p.wastage=x.wastage;if(x.qty!=='')p.openQty=n(p.openQty)+n(x.qty)-cur.q;if(x.weight!=='')p.openWt=n(p.openWt)+n(x.weight)-cur.w}
  else{const code=x.code&&!db.products.some(p=>p.code.toLowerCase()===x.code.toLowerCase())?x.code:genCode(x.metal);db.products.push({id:uid(),code,category:x.cat,name:x.name,dealerId,metal:x.metal,tunch:x.tunch,wastage:x.wastage,openQty:n(x.qty),openWt:n(x.weight)})}
 });
 save();render();alert('Inventory imported');
}

/* ---------- bhav & profit ---------- */
function vBhav(){
 const u=bm==='silver'?UNIT(DIV('silver')):'g';
 main.innerHTML=chips([['gold','Gold'],['silver','Silver']],bm,'bm')+`<div class="card"><label>Today's ${bm} bhav (₹ per ${u})<input id="cb" inputmode="decimal" value="${esc(db.settings.curBhav[bm])}"></label><div class="g2"><label>From<input type="date" id="bf" value="${bFrom}"></label><label>To<input type="date" id="bt" value="${bTo}"></label></div></div><div id="bout"></div>`;
 main.querySelectorAll('[data-bm]').forEach(b=>b.onclick=()=>{bm=b.dataset.bm;vBhav()});
 $('#cb').oninput=e=>{db.settings.curBhav[bm]=e.target.value;save();bout()};$('#bf').onchange=e=>{bFrom=e.target.value;bout()};$('#bt').onchange=e=>{bTo=e.target.value;bout()};bout();
}
function stats(type){let fine=0,amtv=0,units=0,c=0;db.bills.filter(b=>b.metal===bm&&b.type===type&&(!bFrom||b.date>=bFrom)&&(!bTo||b.date<=bTo)).forEach(b=>{c++;b.items.forEach(i=>{fine+=n(i.fine);amtv+=n(i.total);units+=n(i.fine)/(b.div||1)})});return{count:c,fine,amt:amtv,avg:units?amtv/units:0}}
function bout(){
 const s=stats('sale'),p=stats('purchase'),cur=n(db.settings.curBhav[bm]),net=s.fine-p.fine,D=bm==='silver'?DIV('silver'):1;let adv='';
 if(cur&&(s.fine||p.fine)){adv=net>0?`<div class="card"><b>Buy-back position</b><div class="mu">You sold ${f3(net)} g more fine than you bought. Avg sale bhav ${f2(s.avg)}.</div><div style="font-size:18px;margin-top:6px" class="${s.avg>=cur?'pos':'neg'}">${s.avg>=cur?'Profit':'Loss'} if bought now: ₹ ${f2(Math.abs((s.avg-cur)*net/D))}</div><div class="mu">Buying below ${f2(s.avg)} makes a profit.</div></div>`:`<div class="card"><b>Net position</b><div class="mu">You hold ${f3(-net)} g more fine than sold. Avg purchase bhav ${f2(p.avg)}.</div><div style="font-size:18px;margin-top:6px" class="${cur>=p.avg?'pos':'neg'}">${cur>=p.avg?'Profit':'Loss'} if sold now: ₹ ${f2(Math.abs((cur-p.avg)*(-net)/D))}</div></div>`}
 const box=(t,x)=>`<div class="card"><b>${t}</b> <span class="mu">(${x.count} bills)</span><div class="g3" style="margin-top:6px"><div><div class="mu">Fine g</div><b>${f3(x.fine)}</b></div><div><div class="mu">Amount ₹</div><b>${f2(x.amt)}</b></div><div><div class="mu">Avg bhav</div><b>${f2(x.avg)}</b></div></div></div>`;
 const rows=sorted().filter(b=>b.metal===bm&&(!bFrom||b.date>=bFrom)&&(!bTo||b.date<=bTo)).slice(0,40).map(b=>{const f=totals(b).fine;const d=cur?(b.type==='sale'?(n(b.bhav)-cur):(cur-n(b.bhav)))*f/(b.div||1):0;return`<div class="card tap" data-a="detail" data-id="${b.id}"><div class="top"><span>${esc(b.no)} · ${esc(b.customerName)}</span>${cur?`<b class="${d>=0?'pos':'neg'}">${d>=0?'+':''}${f2(d)}</b>`:''}</div><div class="mu">${b.date} · ${f3(f)} g @ ${f2(b.bhav)}</div></div>`}).join('');
 $('#bout').innerHTML=box('Sales',s)+box('Purchases',p)+`<div class="card"><b>Net fine (sold − bought)</b><div style="font-size:18px">${f3(net)} g</div></div>`+adv+`<h4>Bhav difference per bill</h4>${cur?'<div class="mu">Sale: gain when current bhav is lower. Purchase: gain when higher.</div>':'<div class="mu">Enter today\'s bhav above.</div>'}${rows}`;
}

const REPORTS=[['summary','Summary'],['sales','Sales register'],['purchases','Purchase register'],['products','Product-wise'],['category','Category-wise'],['parties','Party-wise (all metals)'],['expenses','Expenses (all metals)'],['stock','Stock (current)'],['fixings','Rate cuts']];
let rep={type:'summary',from:'',to:'',metal:'gold'},lastRep=null;
const inR=d=>(!rep.from||d>=rep.from)&&(!rep.to||d<=rep.to);
function vReports(){

function buildReport(){
 const bills=db.bills.filter(b=>inR(b.date)).sort((a,b)=>a.date.localeCompare(b.date)||String(a.no).localeCompare(String(b.no))),mb=bills.filter(b=>b.metal===rep.metal),M=rep.metal.toUpperCase();
 const per=(rep.from||rep.to)?`${rep.from||'start'} to ${rep.to||'today'}`:'All dates',sm=stockMap();
 const pinfo=i=>{const p=db.products.find(x=>x.id===i.pid);return{key:i.pid||('n:'+i.name),code:p?p.code:(i.code||''),cat:p?p.category:(i.cat||UNC),name:p?p.name:i.name}};
 switch(rep.type){
 case'summary':{
  const agg=type=>{let c=0,wt=0,fine=0,amtv=0,cash=0,mf=0,ff=0,nf=0,carry=0,net=0,bal=0,items=0,units=0;mb.filter(b=>b.type===type).forEach(b=>{const t=totals(b);c++;wt+=t.wt;fine+=t.fine;amtv+=t.grand;cash+=n(b.paid);mf+=t.mFine;ff+=t.fixFine;nf+=t.nf;carry+=t.carryFine;net+=t.net;bal+=t.bal;items+=t.items;units+=t.fine/(b.div||1)});return{c,wt,fine,amtv,cash,mf,ff,nf,carry,net,bal,avg:units?items/units:0}};
  const s=agg('sale'),p=agg('purchase'),ex=db.expenses.filter(x=>inR(x.date)).reduce((a,x)=>a+x.amount,0);
  return{title:`Summary – ${M}`,note:per,cols:[['Metric','s'],['Sales','s'],['Purchases','s']],rows:[['Bills',s.c,p.c],['Weight (g)',f3(s.wt),f3(p.wt)],['Bill fine (g)',f3(s.fine),f3(p.fine)],['Metal fine received / given (g)',f3(s.mf),f3(p.mf)],['Rate-cut fine used (g)',f3(s.ff),f3(p.ff)],['Net fine (g)',f3(s.nf),f3(p.nf)],['  of which carried as fine balance (g)',f3(s.carry),f3(p.carry)],['Avg bhav',f2(s.avg),f2(p.avg)],['Cash payable ₹ (net fine in cash + extras)',f2(s.net),f2(p.net)],['Cash received / paid ₹',f2(s.cash),f2(p.cash)],['Outstanding ₹',f2(s.bal),f2(p.bal)],['Fine sold − bought (g)',f3(s.fine-p.fine),''],['Expenses ₹ (all metals)',f2(ex),''],['Net cash ₹ (in − out − expenses)',f2(s.cash-p.cash-ex),'']]}}
 case'sales':case'purchases':{
  const ty=rep.type==='sales'?'sale':'purchase',rows=mb.filter(b=>b.type===ty).map(b=>{const t=totals(b);return[b.date,b.no,b.customerName,t.wt,t.fine,t.fixFine,t.mFine,t.nf,t.net,n(b.paid),t.bal]});
  return{title:`${ty==='sale'?'Sales':'Purchase'} register – ${M}`,note:per,cols:[['Date','s'],['Bill','s'],['Party','s'],['Wt g','g'],['Fine g','g'],['Rate-cut g','g'],['Metal g','g'],['Net fine g','g'],['Cash payable ₹','r'],['Cash ₹','r'],['Balance ₹','r']],rows,tot:[3,4,5,6,7,8,9,10]}}
 case'products':{
  const m={};mb.forEach(b=>b.items.forEach(i=>{const pi=pinfo(i),x=m[pi.key]=m[pi.key]||{pi,s:[0,0,0,0],p:[0,0,0]};const a=b.type==='sale'?x.s:x.p;a[0]+=n(i.qty);a[1]+=n(i.weight);a[2]+=n(i.fine);if(b.type==='sale')a[3]+=n(i.total)}));
  return{title:`Product-wise – ${M}`,note:per,cols:[['Code','s'],['Category','s'],['Product','s'],['Sold pcs','i'],['Sold g','g'],['Sold fine','g'],['Sold ₹','r'],['Bought pcs','i'],['Bought g','g'],['Bought fine','g']],rows:Object.values(m).sort((a,b)=>a.pi.cat.localeCompare(b.pi.cat)||a.pi.name.localeCompare(b.pi.name)).map(x=>[x.pi.code,x.pi.cat,x.pi.name,...x.s,...x.p]),tot:[3,4,5,6,7,8,9]}}
 case'category':{
  const m={};const g=c=>m[c]=m[c]||{sq:0,sw:0,sf:0,sa:0,pq:0,pw:0,stq:0,stw:0};
  mb.forEach(b=>b.items.forEach(i=>{const c=pinfo(i).cat,x=g(c);if(b.type==='sale'){x.sq+=n(i.qty);x.sw+=n(i.weight);x.sf+=n(i.fine);x.sa+=n(i.total)}else{x.pq+=n(i.qty);x.pw+=n(i.weight)}}));
  db.products.filter(p=>p.metal===rep.metal).forEach(p=>{const x=g(p.category);x.stq+=sm[p.id].q;x.stw+=sm[p.id].w});
  return{title:`Category-wise – ${M}`,note:per+' · stock is current',cols:[['Category','s'],['Sold pcs','i'],['Sold g','g'],['Sold fine','g'],['Sold ₹','r'],['Bought pcs','i'],['Bought g','g'],['Stock pcs','i'],['Stock g','g']],rows:Object.keys(m).sort().map(k=>[k,m[k].sq,m[k].sw,m[k].sf,m[k].sa,m[k].pq,m[k].pw,m[k].stq,m[k].stw]),tot:[1,2,3,4,5,6,7,8]}}
 case'parties':{
  const upTo=rep.to||'',m={};db.customers.forEach(c=>m[c.id]={name:c.name,type:c.type,si:0,pu:0});
  bills.forEach(b=>{if(!b.customerId)return;const x=m[b.customerId];if(!x)return;const t=totals(b);if(b.type==='sale')x.si+=t.net;else x.pu+=t.net});
  return{title:'Party-wise',note:per+' · balances as of '+(upTo||'today')+' · + receivable / − payable',cols:[['Party','s'],['Type','s'],['Sales ₹','r'],['Purchases ₹','r'],['Balance ₹','r'],['Gold fine g','g'],['Silver fine g','g']],rows:Object.keys(m).sort((a,b)=>m[a].name.localeCompare(m[b].name)).map(id=>{const L=ledger(id,upTo);return[m[id].name,m[id].type,m[id].si,m[id].pu,L.bal,L.fine.gold,L.fine.silver]}),tot:[2,3,4,5,6]}}
 case'expenses':{
  const m={};db.expenses.filter(x=>inR(x.date)).forEach(x=>{const k=x.cat||'Other',a=m[k]=m[k]||[0,0];a[0]++;a[1]+=x.amount});
  return{title:'Expenses by category',note:per,cols:[['Category','s'],['Entries','i'],['Amount ₹','r']],rows:Object.keys(m).sort().map(k=>[k,m[k][0],m[k][1]]),tot:[1,2]}}
 case'stock':{
  return{title:`Stock – ${M}`,note:'Current stock',cols:[['Code','s'],['Category','s'],['Product','s'],['Dealer','s'],['Pcs','i'],['Weight g','g'],['Tunch %','r'],['Fine g','g']],rows:db.products.filter(p=>p.metal===rep.metal).sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name)).map(p=>[p.code,p.category,p.name,custName(p.dealerId)||'-',sm[p.id].q,sm[p.id].w,n(p.tunch),sm[p.id].w*n(p.tunch)/100]),tot:[4,5,7]}}
 case'fixings':{
  return{title:`Rate cuts – ${M}`,note:per,cols:[['Date','s'],['With','s'],['Party','s'],['Fine g','g'],['Rate ₹','r'],['Used g','g'],['Open g','g'],['Value ₹','r'],['Paid ₹','r'],['Balance ₹','r']],rows:db.fixings.filter(f=>f.metal===rep.metal&&inR(f.date)).sort((a,b)=>a.date.localeCompare(b.date)).map(f=>{const u=fixUsed(f.id);return[f.date,f.type==='sale'?'Customer':'Dealer',custName(f.partyId)||'-',n(f.fine),n(f.rate),u,n(f.fine)-u,fixVal(f),n(f.paid),fixVal(f)-n(f.paid)]}),tot:[3,5,6,7,8,9]}}
 }
}
function repFmt(v,t){return t==='g'?f3(v):t==='r'?f2(v):t==='i'?f0(v):esc(v)}
function repTable(r){
 const tot=r.tot?r.cols.map((c,i)=>r.tot.includes(i)?r.rows.reduce((s,x)=>s+n(x[i]),0):(i===0?'Total':'')):null;
 return`<div class="tw"><table class="rep"><tr>${r.cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr>${r.rows.length?r.rows.map(x=>`<tr>${x.map((v,i)=>`<td>${repFmt(v,r.cols[i][1])}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${r.cols.length}">No data</td></tr>`}${tot&&r.rows.length?`<tr class="tot">${tot.map((v,i)=>`<td>${r.tot.includes(i)?repFmt(v,r.cols[i][1]):esc(v)}</td>`).join('')}</tr>`:''}</table></div>`}
function rout(){lastRep=buildReport();$('#rout').innerHTML=`<div class="card"><b>${esc(lastRep.title)}</b><div class="mu">${esc(lastRep.note)}</div></div>${repTable(lastRep)}<div class="g2"><button class="btn" data-a="repcsv">Download CSV</button><button class="btn pri" data-a="repprint">Print / PDF</button></div>`}

 if(ty&&draft){draft.type=ty.dataset.ty;draft.fixes=[];if(draft.customerId==='__new')draft.pn.type=draft.type==='purchase'?'dealer':'customer';rerender();return}

 const go=e.target.closest('[data-go]');if(go){tab=go.dataset.go;render();scrollTo(0,0);return}
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
 switch(a){
  case'fab':tab==='cust'?openCust():tab==='stock'?openProd():tab==='fix'?openFix():openBill();break;
  case'back':tab='more';render();break;

  case'savecust':{const c={id:cdraft.id,name:$('#c-name').value.trim(),type:$('#c-type').value,phone:$('#c-phone').value.trim(),addr:$('#c-addr').value.trim(),notes:$('#c-notes').value.trim()};if(!c.name){alert('Enter a name');break}
   if(db.customers.some(x=>x.id!==c.id&&x.name.toLowerCase()===c.name.toLowerCase()&&x.type===c.type&&(!c.phone||!x.phone||x.phone===c.phone))&&!confirm('A party with this name already exists. Save anyway?'))break;
   const i=db.customers.findIndex(x=>x.id===c.id);if(i>=0)db.customers[i]=c;else db.customers.push(c);db.bills.forEach(b=>{if(b.customerId===c.id)b.customerName=c.name});save();closeSheet();render();break}
  case'delcust':{const used=db.bills.filter(b=>b.customerId===id).length+db.fixings.filter(f=>f.partyId===id).length;if(used){alert('This party has '+used+' bills / rate cuts and cannot be deleted.');break}if(confirm('Delete this party?')){db.customers=db.customers.filter(c=>c.id!==id);db.products.forEach(p=>{if(p.dealerId===id)p.dealerId=''});save();closeSheet();render()}break}
  case'prod':openProd(id);break;
  case'saveprod':saveProd();break;
  case'delprod':{const used=db.bills.filter(b=>b.items.some(i=>i.pid===id)).length;if(used){alert('This product is used in '+used+' bills and cannot be deleted. Set its stock to 0 instead.');break}if(confirm('Delete this product from inventory?')){db.products=db.products.filter(p=>p.id!==id);save();closeSheet();render()}break}
  case'impcsv':$('#impcsv').click();break;
  case'expcsv':exportInv();break;
  case'tplcsv':dl('inventory-template.csv','code,category,sub category,dealer,metal,tunch,wastage,qty,weight\nG-0001,Earrings,Rajkot tops,Shree Gold,gold,75,10,12,118.5\nS-0001,Anklet,Silver payal,,silver,92.5,5,20,640');break;
  case'fix':openFix(id);break;
  case'savefix':{
   const old=db.fixings.find(x=>x.id===xdraft.id),metal=$('#x-metal').value,f={id:xdraft.id,date:$('#x-date').value||today(),type:$('#x-type').value,metal,partyId:$('#x-party').value,fine:n($('#x-fine').value),rate:n($('#x-rate').value),paid:n($('#x-paid').value),note:$('#x-note').value.trim(),div:old&&old.metal===metal?(old.div||1):DIV(metal)};
   if(f.fine<=0||f.rate<=0){alert('Enter fine weight and rate');break}
   if(f.paid<0){alert('Paid amount cannot be negative');break}
   if(old&&f.fine<fixUsed(f.id)-0.0005){alert('Fine weight cannot be less than the '+f3(fixUsed(f.id))+' g already used in bills');break}
   const i=db.fixings.findIndex(x=>x.id===f.id);if(i>=0)db.fixings[i]=f;else db.fixings.push(f);save();closeSheet();render();break}
  case'delfixrec':{const u=fixUsed(id);if(u>0){alert('This rate cut is used in bills ('+f3(u)+' g) and cannot be deleted.');break}if(confirm('Delete this rate cut?')){db.fixings=db.fixings.filter(x=>x.id!==id);save();closeSheet();render()}break}
  case'addexp':{const amtv=n($('#e-amt').value);if(amtv<=0){alert('Enter a valid amount');break}db.expenses.push({id:uid(),date:$('#e-date').value||today(),amount:amtv,cat:$('#e-cat').value.trim(),note:$('#e-note').value.trim()});save();expMonth=($('#e-date').value||today()).slice(0,7);vExp();break}
  case'delexp':if(confirm('Delete expense?')){db.expenses=db.expenses.filter(x=>x.id!==id);save();fillExp()}break;
  case'repcsv':if(lastRep)dl('report-'+rep.type+'-'+today()+'.csv',[lastRep.cols.map(c=>csvCell(c[0])).join(',')].concat(lastRep.rows.map(r=>r.map((v,i)=>csvCell(['g','r'].includes(lastRep.cols[i][1])?r3(v):v)).join(','))).join('\n'));break;
  case'repprint':if(lastRep){const s=db.settings.shop;printHTML(`<div class="pb"><h2>${esc(s.name)}</h2><div class="c"><b>${esc(lastRep.title)}</b><br>${esc(lastRep.note)}</div>${repTable(lastRep).replace('class="tw"','').replace('class="rep"','')}</div>`)}break;
  case'export':dl('jewelbill-backup-'+today()+'.json',JSON.stringify(db),'application/json');break;
  case'import':$('#imp').click();break;
  case'wipe':if(confirm('Erase ALL bills, parties, inventory and expenses?')&&confirm('Really erase everything?')){db=fresh();save();render()}break;
 }
});
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.bills||!d.customers)throw 0;if(confirm('Replace current data with this backup?')){localStorage.setItem(KEY,JSON.stringify(d));db=load();render()}}catch(x){alert('Invalid backup file')}};r.readAsText(f);e.target.value=''};
$('#impcsv').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importCSV(String(r.result).replace(/^﻿/,''));r.readAsText(f);e.target.value=''};
if (window.JewelBillNative) window.print = () => JewelBillNative.printPage();
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
